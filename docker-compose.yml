services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: serviceops
      POSTGRES_USER: serviceops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - serviceops_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceops -d serviceops"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://serviceops:${POSTGRES_PASSWORD}@db:5432/serviceops
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PGSSL: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_REPORT_MODEL: ${OPENAI_REPORT_MODEL:-gpt-4o-mini}
    ports:
      - "3000:3000"
    volumes:
      - serviceops_uploads:/app/storage

volumes:
  serviceops_db:
  serviceops_uploads:
